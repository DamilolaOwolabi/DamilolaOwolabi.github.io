name: Update ERCOT grid snapshot

# Refreshes _data/ercot.json (the "Texas grid snapshot" card on the home page)
# once a day with the previous day's ERCOT fuel mix, then redeploys the site.

on:
  schedule:
    - cron: "17 11 * * *" # 11:17 UTC daily (early morning in Texas)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ercot-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ERCOT snapshot
        run: python3 bin/fetch_ercot_snapshot.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- _data/ercot.json; then
            echo "No change in snapshot."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/ercot.json
          git commit -m "Update ERCOT grid snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
